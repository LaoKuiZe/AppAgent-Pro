MODEL: "OpenAI"  # The type of multi-modal LLM you would like to use to power the AppAgent-Pro

OPENAI_API_BASE: "" # The base URL of the OpenAI API
OPENAI_API_KEY: ""  # Set the value to sk-xxx if you host the openai interface for open llm model
OPENAI_API_MODEL: "gpt-4o"  # The OpenAI model should support visual input
MAX_TOKENS: 800  # The max token limit for the response completion
TEMPERATURE: 0.0  # The temperature of the model: the lower the value, the more consistent the output of the model
REQUEST_INTERVAL: 10  # Time in seconds between consecutive GPT-4V requests

ANDROID_SCREENSHOT_DIR: "/data/local/tmp"  # Set the directory on your Android device to store the intermediate screenshots. Make sure the directory EXISTS on your phone!
ANDROID_XML_DIR: "/data/local/tmp"  # Set the directory on your Android device to store the intermediate XML files used for determining locations of UI elements on your screen. Make sure the directory EXISTS on your phone!

DOC_REFINE: false  # Set this to true will make the agent refine existing documentation based on the latest demonstration; otherwise, the agent will not regenerate a new documentation for elements with the same resource ID.
MAX_ROUNDS: 20  # Set the round limit for the agent to complete the task
DARK_MODE: false  # Set this to true if your app is in dark mode to enhance the element labeling
MIN_DIST: 30  # The minimum distance between elements to prevent overlapping during the labeling process

AUTO_DOC_GENERATION: false  # Set this to true to automatically generate documentation after completing subtasks; otherwise, no documentation will be generated